<!DOCTYPE html>
<html>
<head>
    <title>Web Worker Example</title>
</head>
<body>

<h2>Open the Console (F12)</h2>

<script>
    var worker = new Worker("worker.js");

    worker.onmessage = function(event) {
        console.log(event.data);
    };

    worker.onerror = function() {
        console.log("Worker Error");
    };
</script>

</body>
</html>
